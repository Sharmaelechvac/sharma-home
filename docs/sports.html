<!DOCTYPE html>
<html lang="en" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Games · SHARMA360</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
  :root {
    --navy: #264387; --ink: #1d2433; --gray: #5b6478; --line: #dfe4ee;
    --page: #f4f6fb; --card: #ffffff;
    --radius: 20px;
    --shadow: 0 8px 28px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: -apple-system, "SF Pro Text", Inter, ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 0 4px;
  }
  .back {
    display: inline-flex; align-items: center; gap: 2px;
    color: var(--navy); font-size: 17px; font-weight: 600; text-decoration: none;
    padding: 8px 8px 8px 0;
  }
  .back:active { opacity: 0.55; }
  .refresh {
    appearance: none; border: 1px solid var(--line); background: var(--card);
    color: var(--navy); font: inherit; font-size: 15px; font-weight: 600;
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  .refresh:active { opacity: 0.55; }
  .brand { text-align: center; padding: 16px 0; background: linear-gradient(160deg,#1a2f61,#264387); border-radius: 16px; }
  .brand img { width: 168px; max-width: 60vw; height: auto; }
  h1 {
    font-family: -apple-system, "SF Pro Display", Inter, sans-serif;
    font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 10px 0 2px;
  }
  .sub { color: var(--gray); font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  h2.sec {
    font-family: -apple-system, "SF Pro Display", Inter, sans-serif;
    font-size: 21px; font-weight: 700; letter-spacing: -0.01em; margin: 24px 2px 4px;
    display: flex; align-items: baseline; gap: 8px;
  }
  h2.sec .count { font-size: 14px; font-weight: 600; color: var(--gray); }
  h3.day {
    font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--gray); margin: 16px 2px 0;
  }
  .gcard {
    display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: center;
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 14px; margin-top: 10px;
  }
  .gcard__teams { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .grow { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .grow--lose { opacity: 0.42; }
  .grow__logo, .grow__badge { flex: none; width: 28px; height: 28px; border-radius: 6px; }
  .grow__logo { object-fit: contain; background: transparent; display: block; }
  .grow__badge {
    display: none; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; letter-spacing: 0.02em; color: #fff; background: var(--navy);
  }
  .grow__meta { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 6px; }
  .grow__abbr { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; color: #10203d; }
  .grow__rec { font-size: 12px; font-weight: 600; color: #8b93a6; }
  .grow__score {
    flex: none; margin-left: auto; font-size: 22px; font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: #10203d;
    min-width: 2ch; text-align: right;
  }
  .gcard__status { text-align: right; min-width: 64px; }
  .gcard__when { font-size: 13px; font-weight: 700; color: #10203d; line-height: 1.25; }
  .gcard__when--live { color: #c8102e; }
  .gcard__chan { font-size: 12px; font-weight: 600; color: var(--gray); margin-top: 2px; }
  .empty {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 14px; margin-top: 10px; color: var(--gray); font-size: 15px; font-weight: 500;
  }
  .skel { color: var(--gray); font-size: 15px; font-weight: 500; padding: 14px 2px 0; }
  .foot { text-align: center; margin-top: 34px; }
  .foot img { width: 118px; height: auto; background: linear-gradient(160deg,#1a2f61,#264387); padding: 8px 10px; border-radius: 10px; box-sizing: border-box; }
  .foot div { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--gray); opacity: 0.7; margin-top: 4px; text-transform: uppercase; }
  /* Desktop pass (2026-11-27): widen the page column on desktop only. */
  @media (min-width: 1024px) { body { max-width: 920px; } }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="./" aria-label="Back to SHARMA360 home">&#8249; Home</a>
    <button type="button" class="refresh" id="refreshBtn">Refresh</button>
  </div>
  <div class="brand"><img src="assets/sharma360-logo-reversed.png?v=2026-11-26.2" alt="SHARMA360"></div>
  <h1>All Games</h1>
  <p class="sub">Every NBA &amp; NFL game — not just the New York and Florida teams on the home page.</p>

  <h2 class="sec">NBA <span class="count" id="nbaCount"></span></h2>
  <div id="nbaBoard"><div class="skel">Loading scores…</div></div>

  <h2 class="sec">NFL <span class="count" id="nflCount"></span></h2>
  <div id="nflBoard"><div class="skel">Loading scores…</div></div>

  <div class="foot">
    <img src="assets/sharma360-logo-reversed.png?v=2026-11-26.2" alt="">
    <div>Powered by Sharma360</div>
  </div>

<script>
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
function initialsOf(s){
  return String(s || '?').split(/\s+/).map(function(w){ return w.charAt(0); }).join('').slice(0, 3).toUpperCase();
}
var ESPN_LOGO = {
  NBA: 'https://a.espncdn.com/i/teamlogos/nba/500/scoreboard/',
  NFL: 'https://a.espncdn.com/i/teamlogos/nfl/500/scoreboard/'
};
function etYmd(offset){
  var ms = Date.now() + (offset || 0) * 864e5;
  try {
    var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date(ms));
    var z = {};
    parts.forEach(function(p){ z[p.type] = p.value; });
    return z.year + z.month + z.day;
  } catch (e) {
    var d = new Date(ms);
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  }
}
function etYmdOf(iso){
  try {
    var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date(iso));
    var z = {};
    parts.forEach(function(p){ z[p.type] = p.value; });
    return z.year + z.month + z.day;
  } catch (e) { return ''; }
}
function recordOf(c){
  var recs = c && c.records || [];
  for (var i = 0; i < recs.length; i++) if ((recs[i].type || recs[i].name) === 'total' || /overall/i.test(recs[i].name || '')) return recs[i].summary || '';
  return recs[0] && recs[0].summary || '';
}
function broadcastOf(comp){
  var names = [];
  (comp.broadcasts || []).forEach(function(b){
    (b.names || (b.name ? [b.name] : [])).forEach(function(n){ if (n && names.indexOf(n) < 0) names.push(n); });
  });
  var prefer = /^(CBS|FOX|NBC|ABC|ESPN|ESPN2|NFLN|NBA TV|Prime|Amazon|Peacock|ABC|TNT|Max)/i;
  for (var i = 0; i < names.length; i++) if (prefer.test(names[i])) return names[i];
  return names[0] || '';
}
function parseEspnEvent(e, league){
  var comp = (e.competitions || [])[0]; if (!comp) return null;
  var teams = {};
  (comp.competitors || []).forEach(function(c){ teams[c.homeAway] = c; });
  var away = teams.away, home = teams.home;
  if (!away || !home) return null;
  var st = (comp.status && comp.status.type) || {};
  return {
    id: e.id || (league + ((away.team || {}).abbreviation || '') + ((home.team || {}).abbreviation || '') + (e.date || '')),
    league: league,
    date: e.date,
    state: st.state || '',
    status: st,
    short: st.shortDetail || st.detail || st.description || '',
    channel: broadcastOf(comp),
    away: away,
    home: home
  };
}
function teamRow(c, state, league){
  var team = c.team || {};
  var abbr = team.abbreviation || '';
  var rec = recordOf(c);
  var score = (state === 'pre') ? '' : (c.score == null ? '' : String(c.score));
  var lose = (state === 'post' && c.winner === false);
  var logo = team.logo || (ESPN_LOGO[league] && abbr ? ESPN_LOGO[league] + abbr.toLowerCase() + '.png' : '');
  var color = team.color ? ('#' + String(team.color).replace(/^#/, '')) : '#264387';
  var badge = esc((abbr || initialsOf(team.shortDisplayName || team.displayName || '?')).slice(0, 3));
  return '<div class="grow' + (lose ? ' grow--lose' : '') + '">'
    + (logo ? '<img class="grow__logo" src="' + esc(logo) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' : '')
    + '<span class="grow__badge" style="background:' + esc(color) + (logo ? '' : ';display:flex') + '">' + badge + '</span>'
    + '<span class="grow__meta"><span class="grow__abbr">' + esc(abbr) + '</span>'
    + (rec ? '<span class="grow__rec">' + esc(rec) + '</span>' : '') + '</span>'
    + (score !== '' ? '<span class="grow__score">' + esc(score) + '</span>' : '')
    + '</div>';
}
function gameStatusHtml(g){
  var when = '', live = false, chan = g.channel || '';
  if (g.state === 'post') when = 'Final';
  else if (g.state === 'in') { when = g.short.replace(/\s+/g, ' '); live = true; }
  else {
    try {
      var dt = new Date(g.date);
      when = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true }).format(dt);
    } catch (e) { when = g.short || ''; }
  }
  return '<div class="gcard__status"><div class="gcard__when' + (live ? ' gcard__when--live' : '') + '">' + esc(when) + '</div>'
    + (chan ? '<div class="gcard__chan">' + esc(chan) + '</div>' : '') + '</div>';
}
function gameCardHtml(g){
  return '<div class="gcard">'
    + '<div class="gcard__teams">' + teamRow(g.away, g.state, g.league) + teamRow(g.home, g.state, g.league) + '</div>'
    + gameStatusHtml(g) + '</div>';
}
function sortGames(games){
  var rank = function(g){ return (g.state === 'in' ? 0 : g.state === 'pre' ? 1 : 2); };
  games.sort(function(a, b){
    var d = rank(a) - rank(b);
    if (d) return d;
    return String(a.date).localeCompare(String(b.date));
  });
  return games;
}
function dayLabel(ymd){
  if (ymd === etYmd(0)) return 'Today';
  if (ymd === etYmd(-1)) return 'Yesterday';
  if (ymd === etYmd(1)) return 'Tomorrow';
  try {
    var d = new Date(ymd.slice(0, 4) + '-' + ymd.slice(4, 6) + '-' + ymd.slice(6, 8) + 'T12:00:00');
    return new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'short', day: 'numeric' }).format(d);
  } catch (e) { return ''; }
}
function renderNba(games){
  var host = document.getElementById('nbaBoard');
  document.getElementById('nbaCount').textContent = games.length === 1 ? '1 game' : (games.length + ' games');
  if (!games.length) { host.innerHTML = '<div class="empty">No NBA games yesterday, today or tomorrow.</div>'; return; }
  var order = [etYmd(-1), etYmd(0), etYmd(1)];
  var byDay = {};
  games.forEach(function(g){
    var k = etYmdOf(g.date) || etYmd(0);
    (byDay[k] = byDay[k] || []).push(g);
  });
  var html = '';
  order.forEach(function(k){
    if (!byDay[k] || !byDay[k].length) return;
    html += '<h3 class="day">' + esc(dayLabel(k)) + '</h3>' + sortGames(byDay[k]).map(gameCardHtml).join('');
  });
  Object.keys(byDay).forEach(function(k){
    if (order.indexOf(k) !== -1) return;
    html += '<h3 class="day">' + esc(dayLabel(k)) + '</h3>' + sortGames(byDay[k]).map(gameCardHtml).join('');
  });
  host.innerHTML = html;
}
function renderNfl(games){
  var host = document.getElementById('nflBoard');
  document.getElementById('nflCount').textContent = games.length === 1 ? '1 game' : (games.length + ' games');
  if (!games.length) { host.innerHTML = '<div class="empty">No NFL games on the board this week.</div>'; return; }
  host.innerHTML = sortGames(games).map(gameCardHtml).join('');
}
function loadAll(){
  var days = [etYmd(-1), etYmd(0), etYmd(1)];
  var nba = days.map(function(d){
    return fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=' + d)
      .then(function(r){ if (!r.ok) throw new Error('nba'); return r.json(); })
      .catch(function(){ return { events: [] }; });
  });
  var nfl = fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard')
    .then(function(r){ if (!r.ok) throw new Error('nfl'); return r.json(); })
    .catch(function(){ return { events: [] }; });
  Promise.all(nba.concat([nfl])).then(function(parts){
    var nbaGames = [], nflGames = [], seen = {};
    parts.forEach(function(board, i){
      var league = i < days.length ? 'NBA' : 'NFL';
      (board.events || []).forEach(function(e){
        var g = parseEspnEvent(e, league);
        if (!g || seen[g.id]) return;
        seen[g.id] = 1;
        if (league === 'NBA') nbaGames.push(g); else nflGames.push(g);
      });
    });
    renderNba(nbaGames);
    renderNfl(nflGames);
  }).catch(function(){
    renderNba([]);
    renderNfl([]);
  });
}
document.getElementById('refreshBtn').addEventListener('click', loadAll);
loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
