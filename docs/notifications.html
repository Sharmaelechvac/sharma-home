<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#264387">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sharma Home">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="push.css">
  <title>Notifications · Sharma Home</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: #f4f6fb; color: #1d2433;
      font-family: -apple-system, "SF Pro Text", Inter, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px calc(30px + env(safe-area-inset-bottom, 0px)); }
    header { background: #fff; margin: 0 -14px; padding: 14px 14px 12px; border-bottom: 3px solid #F0A846; }
    .hrow { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    header img { height: 44px; width: auto; }
    header h1 { margin: 0; font-weight: 700; font-size: 25px; letter-spacing: 0.01em; color: #1a2f61; line-height: 1; }
    header p { margin: 3px 0 0; color: #5b6478; font-size: 15px; }
    .back { display: inline-block; margin: 16px 0 4px; font-size: 18px; font-weight: 600; color: #264387; text-decoration: none; }
    main { margin-top: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="hrow">
        <img src="logo.png" alt="Sharma Electric &amp; HVAC">
        <div>
          <h1>Notifications</h1>
          <p>Sharma Home alerts on this phone</p>
        </div>
      </div>
    </header>
    <a class="back" href="/sharma-home/">&larr; Back to Sharma Home</a>
    <main>
      <!-- The panel itself is push.js (the same module the About sheet will
           mount once the index.html hook lands). -->
      <div data-sharma-push></div>
      <noscript><p style="font-size:18px">Notifications need JavaScript turned on.</p></noscript>
    </main>
  </div>
  <script src="push.js"></script>
</body>
</html>
