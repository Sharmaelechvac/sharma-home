    <style>
    :root {
      --navy: #264387; --navy-dark: #1a2f61; --gold: #F0A846;
      --ink: #1d2433; --gray: #5b6478; --line: #dfe4ee; --page: #f4f6fb; --panel: #ffffff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--page); color: var(--ink);
      font-family: -apple-system, "SF Pro Text", Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px 30px; }

    header { background: #fff; margin: 0 -14px; padding: 14px 14px 12px; border-bottom: 3px solid var(--gold); }
    .hrow { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    header img { height: 44px; width: auto; }
    header h1 { margin: 0; font-family: -apple-system, "SF Pro Display", Inter, sans-serif; font-weight: 700;
      font-size: 25px; letter-spacing: 0.01em; color: var(--navy-dark); line-height: 1; }
    header p { margin: 3px 0 0; color: var(--gray); font-size: 13px; }
    .badge { max-width: 560px; margin: 8px auto 0; font-size:13px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--gray); }

    .search { width: 100%; margin: 16px 0 4px; padding: 13px 14px; font: inherit; font-size: 16px;
      color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; outline: none; }
    .search:focus { border-color: var(--navy); }

    h2.sec { margin: 22px 2px 8px; font-family: -apple-system, "SF Pro Display", Inter, sans-serif; font-weight: 700;
      font-size: 20px; color: var(--navy-dark); }
    h2.sec::after { content: ""; display: block; height: 2px; background: var(--gold); margin-top: 5px; }

    .rows { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
    a.row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 9px 12px;
      color: var(--ink); text-decoration: none; border-top: 1px solid var(--line); }
    a.row:first-child { border-top: none; }
    a.row:active { background: #eef2fa; }
    .mono { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 4px; background: var(--navy);
      color: #fff; font-family: -apple-system, "SF Pro Display", Inter, sans-serif; font-weight: 700; font-size: 14px;
      display: flex; align-items: center; justify-content: center; letter-spacing: 0.03em; }
    .mono.gold { background: var(--gold); color: var(--navy-dark); }
    .rt { flex: 1 1 auto; min-width: 0; }
    .rn { display: block; font-size: 16px; font-weight: 600; line-height: 1.2; }
    .rd { display: block; font-size: 16px; color: var(--gray); line-height: 1.3; margin-top: 1px; }
    .arr { flex: 0 0 auto; color: var(--gray); font-size: 18px; }

    .folder { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
    .folder > button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 54px;
      padding: 10px 12px; background: var(--panel); border: none; font: inherit; color: var(--ink);
      text-align: left; cursor: pointer; }
    .folder > button:active { background: #eef2fa; }
    .ftab { width: 30px; height: 22px; flex: 0 0 auto; position: relative; }
    .ftab::before { content: ""; position: absolute; left: 0; top: 4px; width: 30px; height: 18px;
      background: var(--gold); border-radius: 3px; }
    .ftab::after { content: ""; position: absolute; left: 2px; top: 0; width: 13px; height: 6px;
      background: var(--gold); border-radius: 3px 3px 0 0; }
    .fname { flex: 1 1 auto; font-family: -apple-system, "SF Pro Display", Inter, sans-serif; font-weight: 700;
      font-size: 20px; color: var(--navy-dark); line-height: 1; }
    .fcount { font-size:13px; color: var(--gray); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .fchev { color: var(--gray); font-size: 18px; transition: transform 0.15s ease; }
    .folder.open .fchev { transform: rotate(90deg); }
    .folder .rows { border: none; border-top: 2px solid var(--gold); border-radius: 0; display: none; }
    .folder.open .rows { display: block; }

    .nomatch { display: none; margin: 18px 2px 0; color: var(--gray); font-size: 14px; }
    footer { margin: 26px 2px 0; color: var(--gray); font-size:13px; text-align: center; line-height: 1.5; }
    .hidden { display: none !important; }
  
    /* --- Sharma kit v1.2 rollout overrides (Batch A) --- */
    .mono { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; background: var(--navy); color: #fff; flex: none; }
    .mono.gold { background: var(--gold); color: #1a2f61; }
    .mono .sk-icon { width: 22px; height: 22px; }
    .rn { font-size: 17px; }
    .arr { color: var(--navy); display: inline-flex; }
    .search { min-height: 48px; font-size: 17px; }
    #lock input, #lock button { font-family: -apple-system, "SF Pro Text", Inter, sans-serif; }
    footer { font-size: 13px; }
</style>

<div id="lock"><form class="box" onsubmit="return shUnlock(event)">
<img src="https://sharma-kit.sharma-crew.workers.dev/assets/logo.png" alt="Sharma Electric &amp; HVAC"><h2>Sharma Home</h2><p>Enter passcode</p>

<script>
async function shUnlock(e){e.preventDefault();var v=document.getElementById('lockpin').value.trim();
var d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sharma-home:'+v));
var x=Array.from(new Uint8Array(d)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
if(x==='51f6a9f8a0017601ef145c7daa916d20a14646d9921090122222a12e9e39b146'){try{localStorage.setItem('sh_home_ok',x)}catch(_){}document.documentElement.classList.remove('locked');if(window.__bootHome)window.__bootHome();}
else{document.getElementById('lockerr').textContent='Wrong passcode';document.getElementById('lockpin').value=''}return false}
</script>
