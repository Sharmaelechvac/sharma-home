    h2.sec::after { content: ""; display: block; height: 2px; background: var(--gold); margin-top: 5px; }

    .rows { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }

    .rt { flex: 1 1 auto; min-width: 0; }

    .rd { display: block; font-size: 16px; color: var(--gray); line-height: 1.3; margin-top: 1px; }
    .arr { flex: 0 0 auto; color: var(--gray); font-size: 18px; }

    .folder { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }

</script>

  PAGES.apps = page;
  page.setHeader({ title: 'Sharma Home', trail: INFO_BTN });
  page.html('<div class="wrap"><div class="sk-pagehead"><div><h1 class="sk-title">Sharma Home</h1><p class="sk-note">Every Sharma app — for Sanjay only</p></div></div>'
    + '<label class="sk-search"><svg class="sk-icon"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search apps…" autocomplete="off"><button type="button" class="sk-search__clear" aria-label="Clear"><svg class="sk-icon"><use href="#i-close"/></svg></button></label>'
    + '<div id="appsHome">' + appsHomeHtml() + '</div><div id="appsResults"></div>'
    + '<footer>Sharma Electric &amp; HVAC · Lic. EC13013924 · CAC1823596<br>Kept current by Jarvis</footer></div>');
  page.refreshable(function(){ return loadData().then(function(){ repaintApps(); }); });
  var q = page.body.querySelector('#q');
  q.addEventListener('input', function(){ paintSearch(page, q.value); });
  page.body.querySelector('.sk-search__clear').addEventListener('click', function(){ q.value = ''; paintSearch(page, ''); q.focus(); });
}
function paintSearch(page, value){
  var home = page.body.querySelector('#appsHome'), res = page.body.querySelector('#appsResults');
  var needle = (value || '').trim().toLowerCase();
  if (!needle) { home.style.display = ''; res.innerHTML = ''; return; }
  var hits = allRows().filter(function(x){ return (x.r.n + ' ' + x.r.d).toLowerCase().indexOf(needle) >= 0; });
  home.style.display = 'none';
  if (!hits.length) { res.innerHTML = '<p class="nomatch" style="display:block">No app matches that search.</p>'; return; }
  var lastWhere = null, h = '';
  hits.forEach(function(x){ if (x.where !== lastWhere) { h += '<h2 class="sec">' + esc(x.where) + '</h2>'; lastWhere = x.where; } h += '<div class="rows">' + rowHtml(x.r) + '</div>'; });
  res.innerHTML = h;
}
function repaintApps(){ var p = PAGES.apps; if (!p) return; var home = p.body.querySelector('#appsHome'); if (home) home.innerHTML = appsHomeHtml(); var q = p.body.querySelector('#q'); if (q && q.value) paintSearch(p, q.value); }
function buildOffice(page){
  PAGES.office = page;
  page.setHeader({ title: 'Office', trail: INFO_BTN });
  var t = tabData('office');
  page.html('<div class="wrap"><div class="sk-pagehead"><div><h1 class="sk-title">Office apps</h1><p class="sk-note">The Hub office set — trackers and admin</p></div></div>' + (t ? sectionsHtml(t) : skelHtml(5)) + '</div>');
  page.refreshable(function(){ return loadData().then(function(){ repaintOffice(); }); });
}
function repaintOffice(){ var p = PAGES.office; if (!p) return; var t = tabData('office'); if (t) p.html('<div class="wrap"><div class="sk-pagehead"><div><h1 class="sk-title">Office apps</h1><p class="sk-note">The Hub office set — trackers and admin</p></div></div>' + sectionsHtml(t) + '</div>'); }
function buildJobs(page){
  PAGES.jobs = page;
  page.setHeader({ title: 'Jobs', trail: INFO_BTN });
  var t = tabData('jobs');
  page.html('<div class="wrap"><div class="sk-pagehead"><div><h1 class="sk-title">Job pages</h1><p class="sk-note">Every house, job by job</p></div></div>' + (t ? sectionsHtml(t) : skelHtml(6)) + '</div>');
  page.refreshable(function(){ return loadData().then(function(){ repaintJobs(); }); });
}
function repaintJobs(){ var p = PAGES.jobs; if (!p) return; var t = tabData('jobs'); if (t) p.html('<div class="wrap"><div class="sk-pagehead"><div><h1 class="sk-title">Job pages</h1><p class="sk-note">Every house, job by job</p></div></div>' + sectionsHtml(t) + '</div>'); }
function buildFolder(page, idx){
  var t = tabData('apps'); if (!t || !t.folders || !t.folders[idx]) { page.html('<div class="wrap">' + skelHtml(4) + '</div>'); return; }
  var f = t.folders[idx];
  page.setHeader({ lead: '<a class="sk-header__btn sk-header__back" href="#/" data-back><svg class="sk-icon"><use href="#i-chevron-left"/></svg>Apps</a>', title: '', trail: INFO_BTN, backHref: '#/' });
  page.html('<div class="wrap"><div class="sk-pagehead"><div><h1 class="sk-title">' + esc(f.name) + '</h1><p class="sk-note">' + esc(f.count) + '</p></div></div><div class="rows">' + f.rows.map(rowHtml).join('') + '</div></div>');
  page.refreshable(function(){ return loadData().then(function(){ buildFolder(page, idx); }); });
}
var BUILDERS = { apps: buildApps, office: buildOffice, jobs: buildJobs };
function route(){
  if (!nav) return;
  var h = location.hash || '#/';
  var m = h.match(/^#\/folder\/(\d+)$/);
  if (m) {
    var idx = +m[1], key = 'folder:' + idx;
    if (!nav.stack[0] || nav.stack[0].key !== 'apps') nav.root('apps', buildApps);
    var at = nav.find(key);
    if (at === -1) nav.push(key, function(p){ buildFolder(p, idx); });
    else if (nav.top().key !== key) nav.popTo(at);
    return;
  }
  var tab = h.indexOf('#/office') === 0 ? 'office' : h.indexOf('#/jobs') === 0 ? 'jobs' : 'apps';
  if (nav.stack[0] && nav.stack[0].key === tab) { if (nav.depth() > 1) nav.popTo(0); }
  else nav.root(tab, BUILDERS[tab]);
}
function loadData(){
  if (window.SK && SK.data) {
    return SK.data('apps.json', function(d){ DATA = d; repaintApps(); repaintOffice(); repaintJobs(); }).catch(function(){ if (!DATA) { DATA = EMBEDDED; repaintApps(); repaintOffice(); repaintJobs(); } });
  }
  DATA = EMBEDDED; repaintApps(); repaintOffice(); repaintJobs();
  return Promise.resolve();
}
function fallbackRender(){
  DATA = EMBEDDED;
  var t = tabData('apps');
  document.getElementById('app').innerHTML = '<div class="wrap"><div class="sk-pagehead"><div><h1 class="sk-title">Sharma Home</h1></div></div>' + sectionsHtml(t) + (tabData('office') ? sectionsHtml(tabData('office')) : '') + (tabData('jobs') ? sectionsHtml(tabData('jobs')) : '') + '</div>';
  var tb = document.querySelector('.sk-tabbar'); if (tb) tb.style.display = 'none';
}
window.__bootHome = function(){
  if (booted) return; booted = true;
  if (window.SK && SK.scheme) { var ap = document.getElementById('appearance'); if (ap) SK.scheme.mountToggle(ap); }
  if (!window.SK || !SK.stack) { fallbackRender(); return; }
  nav = SK.stack('#app', { lead: LOGO_HTML, title: 'Sharma Home' });
  route();
  loadData();
  setTimeout(function(){ if (!DATA) { DATA = EMBEDDED; repaintApps(); repaintOffice(); repaintJobs(); } }, 3000);
};
document.addEventListener('click', function(e){
  var push = e.target.closest && e.target.closest('[data-push]');
  if (push) { location.hash = '#/folder/' + push.getAttribute('data-push'); return; }
  var about = e.target.closest && e.target.closest('.js-about');
  if (about && window.SK && SK.openSheet) { SK.openSheet('about-sheet'); return; }
  if (e.target && e.target.id === 'lockAppBtn') {
    var done = function(){ try { localStorage.removeItem('sh_home_ok'); } catch (err) {} location.reload(); };
    if (window.SK && SK.dataClear) SK.dataClear().then(done); else done();
  }
});
window.addEventListener('hashchange', route);
if (document.documentElement.classList.contains('locked')) { if (window.SK && SK.dataClear) SK.dataClear(); }
else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', window.__bootHome);
else window.__bootHome();
</script>
<script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) { addEventListener("load", function(){ navigator.serviceWorker.register("sw.js?kit=https://sharma-kit.sharma-crew.workers.dev", { scope: "/sharma-home/" }).catch(function(){}); }); }</script>
